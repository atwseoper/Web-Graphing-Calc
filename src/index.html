<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="build-info" content="__BUILD_INFO__">
  <title>Graphing Calculator</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/graph.css">
  <link rel="stylesheet" href="styles/expressions.css">
  <link rel="stylesheet" href="styles/keypad.css">
  <link rel="stylesheet" href="styles/calc.css">
</head>
<body>
  <div id="app">
    <main id="graph" aria-label="Graph">
      <canvas id="graph-canvas" role="img" aria-label="Graph of your expressions"></canvas>

      <div class="graph-tools graph-tools--top">
        <button id="btn-settings" class="tool-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings" data-icon="settings"></button>
      </div>
      <div class="graph-tools graph-tools--side">
        <button id="btn-zoom-in" class="tool-btn" type="button" aria-label="Zoom in" data-icon="plus"></button>
        <button id="btn-zoom-out" class="tool-btn" type="button" aria-label="Zoom out" data-icon="minus"></button>
        <button id="btn-fit" class="tool-btn" type="button" aria-label="Zoom to fit graphs" data-icon="fit"></button>
        <button id="btn-home" class="tool-btn" type="button" aria-label="Reset view" data-icon="home"></button>
      </div>

      <div id="settings" class="popover" role="dialog" aria-label="Settings" hidden></div>
    </main>

    <section id="panel" aria-label="Expressions and tools">
      <div id="sheet-handle" class="panel-handle" role="slider" tabindex="0" aria-label="Panel size" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1"><span></span></div>

      <div class="panel-body">
        <div id="tab-graph" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-graph">
          <ol id="expr-list" class="expr-list" aria-label="Expressions"></ol>
          <button id="btn-add-row" class="add-row" type="button"><span data-icon="plus"></span>Add expression</button>
        </div>

        <div id="tab-solve" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-solve" hidden>
          <p class="placeholder">The equation solver is coming in Phase 2.</p>
        </div>

        <div id="tab-data" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-data" hidden>
          <p class="placeholder">Data import and regression are coming in Phase 3.</p>
        </div>

        <div id="tab-calc" class="tab-panel tab-calc" role="tabpanel" aria-labelledby="tab-btn-calc" hidden>
          <div class="calc-head">
            <p id="calc-empty" class="placeholder">Results appear here. You can use variables and functions from the Graph tab, and <b>Ans</b> for the last answer.</p>
            <button id="calc-clear" class="text-btn" type="button" hidden>Clear history</button>
          </div>
          <ol id="calc-history" class="calc-history" aria-label="Calculation history"></ol>
          <div class="calc-entry">
            <input id="calc-input" class="calc-input" type="text" data-keypad autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Calculation" placeholder="e.g. 2^10 or sqrt(2)">
            <button id="calc-equals" class="equals-btn" type="button" aria-label="Calculate">=</button>
          </div>
        </div>
      </div>

      <div id="keypad" class="keypad" aria-label="Maths keypad" hidden></div>

      <nav class="tab-bar" role="tablist" aria-label="Tools">
        <button role="tab" id="tab-btn-graph" data-tab="graph" aria-controls="tab-graph" aria-selected="true">Graph</button>
        <button role="tab" id="tab-btn-solve" data-tab="solve" aria-controls="tab-solve" aria-selected="false">Solve</button>
        <button role="tab" id="tab-btn-data" data-tab="data" aria-controls="tab-data" aria-selected="false">Data</button>
        <button role="tab" id="tab-btn-calc" data-tab="calc" aria-controls="tab-calc" aria-selected="false">Calc</button>
      </nav>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
